appId: app.oguzhanozgokce.midmoney
name: Profile - menu tap, version and sign out
---
- runFlow: ../common/login.yaml
- tapOn:
    id: "nav.tab.profile"
- assertVisible:
    id: "profile.screen"
- assertVisible:
    id: "profile.version"
# A "coming soon" menu row keeps the user on profile (toast, no navigation)
- tapOn:
    id: "profile.menu.transactions"
- assertVisible:
    id: "profile.screen"
# Sign out returns to the login screen
- tapOn:
    id: "profile.logout"
- assertVisible:
    id: "login.screen"
