# detekt configuration, layered on top of the bundled defaults (buildUponDefaultConfig = true).
# Only rules that need project-specific tuning are listed here.

config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
  UnusedParameter:
    active: false
