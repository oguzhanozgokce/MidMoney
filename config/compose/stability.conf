// Compose compiler stability configuration.
//
// These types are effectively immutable, but the Compose compiler cannot infer that: they live in
// `plugin:market`, which deliberately does NOT apply the Compose plugin — the plugin layer stays
// free of Compose so the domain remains pure Kotlin. Without this file the compiler defaults them
// to unstable, which shows up as `unstable match: SymbolMatch` in the stability report.
//
// Declaring them here instead of annotating them with @Immutable keeps the layering rule intact
// (no Compose types leak into a plugin/domain module).
