format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

app:
  envs:
    - PROJECT_LOCATION: .
    - MODULE: app
    - GRADLEW_PATH: ./gradlew

workflows:
  # Developer bunu seçer → QA (preprod) APK
  build_qa:
    summary: QA build — preprodDebug APK (ktlint + detekt + unit test gate)
    envs:
      - VARIANT: preprodDebug
    after_run:
      - _verify_and_build

  # Developer bunu seçer → PROD APK
  build_prod:
    summary: Prod build — prodDebug APK (ktlint + detekt + unit test gate)
    envs:
      - VARIANT: prodDebug
    after_run:
      - _verify_and_build

  # Ortak adımlar (DRY): statik analiz → unit test → assemble → artifact.
  # Kapılar assemble'dan ÖNCE koşar: testler kırmızıysa APK hiç üretilmez.
  _verify_and_build:
    steps:
      - git-clone@8: {}
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: $GRADLEW_PATH
      - script@1:
          title: Quality gate (ktlint + detekt)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                ./gradlew ktlintCheck detekt --stacktrace
      - script@1:
          title: Unit tests
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                if ! ./gradlew test --stacktrace; then
                  # Ship the HTML reports as an artifact so a red build is diagnosable
                  # from the Bitrise UI instead of only from the log.
                  tar -czf "${BITRISE_DEPLOY_DIR:-.}/unit-test-reports.tgz" \
                    $(find . -type d -path '*/build/reports/tests') || true
                  exit 1
                fi
      - android-build@1:
          title: Assemble $VARIANT
          inputs:
            - project_location: $PROJECT_LOCATION
            - module: $MODULE
            - variant: $VARIANT
      - deploy-to-bitrise-io@2: {}
