format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

app:
  envs:
    - PROJECT_LOCATION: .
    - MODULE: app
    - GRADLEW_PATH: ./gradlew

workflows:
  # Developer bunu seçer → QA (preprod) APK
  build_qa:
    summary: QA build — preprodDebug APK (ktlint + detekt gate)
    envs:
      - VARIANT: preprodDebug
    after_run:
      - _verify_and_build

  # Developer bunu seçer → PROD APK
  build_prod:
    summary: Prod build — prodDebug APK (ktlint + detekt gate)
    envs:
      - VARIANT: prodDebug
    after_run:
      - _verify_and_build

  # Ortak adımlar (DRY): kalite kapısı → assemble → artifact
  _verify_and_build:
    steps:
      - git-clone@8: {}
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: $GRADLEW_PATH
      - script@1:
          title: Quality gate (ktlint + detekt)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                ./gradlew ktlintCheck detekt --stacktrace
      - android-build@1:
          title: Assemble $VARIANT
          inputs:
            - project_location: $PROJECT_LOCATION
            - module: $MODULE
            - variant: $VARIANT
      - deploy-to-bitrise-io@2: {}
